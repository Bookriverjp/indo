# 画面レイアウト正本（2026-09-26 Owner決定）
# 座標は px。main は 1920x1080、shorts は 1080x1920 基準。
# 詳細と使い分けは docs/LAYOUT.md

narrator:
  name: "大仏飴"
  side: "right"          # 右に固定
  facing: "front"        # 正面を向いて語る。説明では草で画面（舞台・カード側）を指す

region_label:
  always_visible: true   # 地域・言語ラベルを常に表示
  example: "西ベンガル州 ・ ベンガル語"

youtube:
  channel_watermark: false   # 右下の透かしロゴは使わない（大仏飴と重なるため）
  end_screen_seconds: 20     # 終了画面の要素は大仏飴を避けて配置

main:
  width: 1920
  height: 1080
  default_layout: "stage"
  layouts:
    # B 紙芝居舞台：物語パートの基本形
    # 構図の正本：assets/reference/layout_stage_reference.webp（2026-09-26 Owner指定）
    # 装飾（外枠・絵の額・字幕の額・右パネル・ラベルの額・敷物）は1枚の固定テンプレート素材にし、
    # 絵・字幕・ラベル文字・大仏飴を窓の位置に重ねる。文字は動画編集段階で描画する。
    stage:
      template:       {x: 0,    y: 0,   w: 1920, h: 1080}  # 固定素材（赤い花模様の外枠ほか装飾一式）
      story_frame:    {x: 46,   y: 46,  w: 1300, h: 794}   # 青地に花模様の額
      story_art:      {x: 100,  y: 116, w: 1184, h: 666}   # 16:9 で生成して縮小
      subtitle_frame: {x: 46,   y: 844, w: 1300, h: 195}   # 字幕の額（絵の外、絵の下）
      subtitle:       {x: 149,  y: 863, w: 1131, h: 147}   # 生成り色の字幕枠。2行まで、中央揃え
      side_panel:     {x: 1349, y: 46,  w: 534,  h: 993}   # 生成り地にペイズリー、上部アーチ
      region_label:   {x: 1424, y: 155, w: 413,  h: 72}    # パネル上部の額の中
      narrator:       {x: 1418, y: 396, w: 419,  h: 534, style: "full_body"}
      rug:            {x: 1378, y: 907, w: 505,  h: 126}   # 大仏飴が立つ敷物
    # A 全面＋ワイプ：フックと山場のみ
    fullbleed:
      story_art:    {x: 0,    y: 0,   w: 1920, h: 1080}
      region_label: {x: 56,   y: 56,  w: 440,  h: 64}
      narrator:     {x: 1564, y: 620, w: 300,  h: 340, style: "medallion", visible_in_hook: false}
      subtitle:     {x: 220,  y: 880, w: 1300, h: 120}
    # C 解説カード：導入・地域紹介・解説・異説・比較・出典
    # stage と同じテンプレートを使い、絵の窓に情報カードを入れる（大仏飴・ラベル・字幕の位置は共通）
    card:
      template:     {x: 0,    y: 0,   w: 1920, h: 1080}
      info_card:    {x: 100,  y: 116, w: 1184, h: 666}
      subtitle:     {x: 149,  y: 863, w: 1131, h: 147}
      region_label: {x: 1424, y: 155, w: 413,  h: 72}
      narrator:     {x: 1418, y: 396, w: 419,  h: 534, style: "full_body"}

  # SPEC 6. 標準構成との対応
  sections:
    hook:        {layout: "fullbleed", narrator: false}
    intro:       {layout: "card"}
    background:  {layout: "card"}
    story:       {layout: "stage", climax_layout: "fullbleed"}
    commentary:  {layout: "card"}
    comparison:  {layout: "card"}
    ending:      {layout: "card"}

  safe_areas:
    - {name: "player_controls", x: 0, y: 990, w: 1920, h: 90}

shorts:
  width: 1080
  height: 1920
  layout:
    wall:         {x: 0,   y: 0,    w: 1080, h: 1920}
    story_art:    {x: 0,   y: 200,  w: 1080, h: 1080}  # 本編の絵を正方形に切り出し
    narrator:     {x: 800, y: 220,  w: 240,  h: 280, style: "medallion"}  # 右のボタン列を避けて右上
    subtitle:     {x: 60,  y: 1300, w: 860,  h: 200}
  safe_areas:
    - {name: "top_ui",      x: 0,   y: 0,    w: 1080, h: 160}
    - {name: "action_bar",  x: 940, y: 900,  w: 140,  h: 680}
    - {name: "title_block", x: 0,   y: 1580, w: 1080, h: 340}
