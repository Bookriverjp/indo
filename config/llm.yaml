# 台本・絵コンテ生成に使うLLM（2026-09-26 Owner決定：Claude）
# APIキーは .env の ANTHROPIC_API_KEY（Gitに入れない）

llm:
  # manual: APIを使わない。依頼ファイルを書き出し、VS Code の Claude Code などで作った JSON を取り込む
  # claude: Anthropic API を直接呼ぶ（.env に ANTHROPIC_API_KEY が必要）
  provider: "manual"
  claude:
    model: "claude-opus-5"
    effort: "high"            # low / medium / high / xhigh / max
    max_tokens: 32000
    fallbacks: "default"      # 安全分類器で断られたとき、サーバー側で推奨モデルに切り替える。無効にするなら null
    max_retries: 3            # 429 / 5xx / 接続エラーはSDKが自動で再試行
  validation_retries: 1       # 出力が schema や出典チェックに通らなかったときの再生成回数

# 料金（USD / 100万トークン）。費用の目安を logs/llm_usage.jsonl に残すために使う
pricing:
  claude-opus-5:   {input: 5.0,  output: 25.0, cache_write: 6.25, cache_read: 0.5}
  claude-opus-4-8: {input: 5.0,  output: 25.0, cache_write: 6.25, cache_read: 0.5}
  claude-sonnet-5: {input: 2.0,  output: 10.0, cache_write: 2.5,  cache_read: 0.2}
