channel:
  working_name: "大仏飴のインド異聞"
  name: "大仏飴のインド異聞"          # 2026-09-26 Owner決定
  description: |
    チンチラの語り部「大仏飴」が、インド各地に残る民話、怪異、伝説、昔話を訪ねます。
    ベンガル、ケーララ、カルナータカ、ラージャスターン、タミル、トゥル……。
    有名な神話ではなく、村、森、寺院、家の戸口に残ってきた「もうひとつのインド」。
    現地語資料・採話資料・研究資料を確認しながら、日本語で紹介します。
  # 「インドの怖い話チャンネル」にしない。インド民俗エンターテインメントとして幅を持たせる
  tone_spectrum: [怖い, 不思議, 美しい, 笑える, 神秘的]
  language: "ja-JP"
  default_duration_minutes: 10
  shorts_enabled: true
  publish_requires_owner_approval: true
  auto_publish_enabled: false

narrator:
  name: "大仏飴"
  species: "chinchilla"
  reference_image: "assets/reference/daibutsuame_reference.jpeg"
  traits:
    - "穏やか"
    - "好奇心がある"
    - "知ったかぶりをしない"
    - "伝承を事実として断定しない"

content:
  themes:
    - folklore
    - legend
    - ghost_story
    - saint_legend
    - temple_legend
    - hero_tale
    - animal_tale
