# ナレーション音声（2026-09-26 Owner決定）
# ライセンス記録：docs/licenses/VOICEVOX.md

tts:
  engine: "voicevox"
  engine_version: "0.25.2"
  endpoint: "http://localhost:50021"
  speaker_name: "中国うさぎ"
  speaker_uuid: "1f18ffc3-47ea-4ce0-9829-0576d03a7ec8"
  speed_scale: 1.05          # 2026-09-26 Owner決定
  post_phoneme_length: 0.1
  credit: "VOICEVOX:中国うさぎ"   # 概要欄とエンディングの出典カードに必ず表記

  # 声色（style id）と大仏飴の表情の対応。docs/CHARACTER_MOTION.md の ID を使う
  styles:
    normal:    {id: 61, name: "ノーマル"}
    surprised: {id: 62, name: "おどろき"}
    scared:    {id: 63, name: "こわがり"}
    limp:      {id: 64, name: "へろへろ"}
  # 読み方（PHASE 6 で実装）。物語はふつうの抑揚、大仏飴のコメントは栃木弁らしく
  #   intonation_scale: 抑揚の強さ（1.0=標準、小さいほど平坦＝無アクセント）
  #   phrase_end_rise:  区切りごとの最後の2モーラの音高を上げる量（尻上がり）
  #   試聴: https://claude.ai/artifact/36Xwi2HnpGkVKBQm1zuRWM
  prosody:
    narration: {intonation_scale: 1.0, phrase_end_rise: 0.0}   # kind: legend, staging
    comment:   {intonation_scale: 0.4, phrase_end_rise: 0.1}   # kind: comment（候補。Owner の試聴で確定）

  expression_to_style:
    default: normal
    surprise: surprised
    scared: scared
    whisper: scared
    sleep: limp
