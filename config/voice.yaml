# ナレーション音声（2026-09-26 Owner決定）
# ライセンス記録：docs/licenses/VOICEVOX.md

tts:
  engine: "voicevox"
  engine_version: "0.25.2"
  endpoint: "http://localhost:50021"
  speaker_name: "中国うさぎ"
  speaker_uuid: "1f18ffc3-47ea-4ce0-9829-0576d03a7ec8"
  speed_scale: 1.05          # 2026-09-26 Owner決定
  post_phoneme_length: 0.1
  credit: "VOICEVOX:中国うさぎ"   # 利用規約の条件。動画の最後の場面に小さく表示する（概要欄には書かない。2026-09-26 Owner決定）

  # 声色（style id）と大仏飴の表情の対応。docs/CHARACTER_MOTION.md の ID を使う
  styles:
    normal:    {id: 61, name: "ノーマル"}
    surprised: {id: 62, name: "おどろき"}
    scared:    {id: 63, name: "こわがり"}
    limp:      {id: 64, name: "へろへろ"}
  # 読み方。物語はふつうの抑揚、大仏飴のコメントは栃木弁らしく（2026-09-26 Owner決定：平坦＋尻上がり）
  # どの kind がどちらかは config/persona.yaml の styles
  #   intonation_scale: 抑揚の強さ（1.0=標準、小さいほど平坦＝無アクセント）
  #   phrase_end_rise:  区切りごとの最後の2モーラの音高を上げる量（尻上がり）
  #   試聴: https://claude.ai/artifact/36Xwi2HnpGkVKBQm1zuRWM
  prosody:
    narration: {intonation_scale: 1.0, phrase_end_rise: 0.0}   # kind: legend, staging
    comment:   {intonation_scale: 0.4, phrase_end_rise: 0.1}   # kind: comment

  # 登場人物の声（script の block.voice）。大仏飴とは別の話者で読む（2026-09-26 第1話で追加）
  # 規約: エンジン同梱の policy で「VOICEVOX:四国めたん」の表記で商用可を確認
  characters:
    woman:
      speaker_name: "四国めたん"
      speaker_uuid: "7ffcb7ce-00ec-4bdc-82cd-45a8889e43ff"
      style_id: 36            # ささやき
      speed_scale: 0.9
      intonation_scale: 1.0
      credit: "VOICEVOX:四国めたん"

  expression_to_style:
    default: normal
    surprise: surprised
    scared: scared
    whisper: scared
    sleep: limp
