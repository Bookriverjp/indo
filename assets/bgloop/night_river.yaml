# 背景ループのシーン設定：夜の川辺の村（月・雲・ヤシ・花の木・川・蓮・葦）
# python -m pipeline.bgloop assets/bgloop/night_river.yaml
#
# 座標は ref_size の画像での px（[x, y]）。矩形は [x0, y0, x1, y1]。別の大きさの画像でも比率で合わせる。
# 色は OpenCV の HSV（H: 0-180, S/V: 0-255）。
# 切り抜きは「ヒント（だいたいの範囲）→ 色で判定 → 元の絵の輪郭に沿って柔らかくする」で自動で作る。
name: night_river
image: night_river.webp          # この YAML からの相対パス（--image で差し替え可）
ref_size: [1672, 941]

# ---------------------------------------------------------------- 切り抜き
sky:
  hue: [98, 118]                 # 夜空の藍
  min_value: 42
  zone: [[0, 0], [1672, 0], [1672, 560], [0, 560]]   # 空がありうる範囲
  grabcut: [[870, 330, 1672, 600]]                   # 遠くの木立（空と色が近い）は GrabCut で分ける
  sure_sky:
    rects: [[650, 0, 1672, 130], [910, 140, 1672, 320], [1000, 320, 1672, 380]]
  sure_land:
    rects: [[0, 560, 1672, 941]]
    lines: [[722, 520, 738, 250, 7], [800, 520, 832, 340, 7]]     # ヤシの幹
    circles: [[740, 232, 14], [835, 330, 12]]                    # ヤシの葉の付け根
  moon: [1242, 183]              # 月のだいたいの中心

clouds:
  core: 0.13                     # 空の明るさより これだけ明るい所を雲の芯にする
  low: 0.045                     # 雲の広がりの下限
  min_rim: 40                    # 金の縁取りがこれだけある かたまりを雲とする（筆の跡や星を除く）
  min_area: 8000                 # または十分大きい かたまり

water:
  zone: [[0, 698], [250, 696], [470, 690], [575, 688], [705, 690], [716, 652], [800, 646], [960, 648],
         [1100, 634], [1265, 627], [1180, 583], [1672, 581], [1672, 941], [0, 941]]
  hue: [96, 122]                 # 水の青
  reflect: {hue: [5, 40], min_sat: 35, min_value: 110}   # 灯りと月の映り込み
  pads: {hue: [26, 62], min_sat: 70, min_value: 50}      # 蓮の葉
  lotus: [[620, 812, 26], [700, 848, 30], [506, 822, 16], [800, 806, 13], [1290, 850, 15]]  # 蓮の花・つぼみ
  boat: [716, 628, 965, 692]     # 舟（ゆっくり上下）
  jetty: [570, 585, 716, 696]    # 桟橋（波で揺らさない）

foreground:                      # 手前の草（別の層にして風で揺らす。後ろの水は自動で補う）
  - name: reeds_left
    zone: [[0, 704], [95, 704], [110, 722], [140, 724], [190, 726], [205, 738], [244, 727], [272, 727],
           [275, 740], [300, 740], [358, 738], [385, 775], [415, 805], [440, 815], [470, 815], [500, 838],
           [532, 860], [540, 941], [0, 941]]
    # 岸の上に重なっている穂は、白い穂と金の茎だけを拾う
    band: [[0, 645], [90, 645], [95, 704], [0, 704]]
  - name: reeds_right
    zone: [[1672, 598], [1640, 598], [1545, 608], [1478, 660], [1428, 712], [1358, 770], [1350, 812],
           [1352, 866], [1402, 868], [1410, 941], [1672, 941]]

lights:                          # 窓・戸口・灯籠：[x, y, r] の円の中の明るい橙をひとつの灯りとしてゆらす
  hue: [5, 35]
  min_sat: 100
  min_value: 190
  spots: [[362, 516, 14], [425, 540, 30], [487, 519, 14], [432, 583, 24], [741, 537, 12], [766, 537, 12],
          [801, 548, 10], [962, 566, 10], [990, 566, 12], [1030, 571, 12], [1103, 571, 12],
          [1340, 548, 9], [1367, 549, 9], [1460, 548, 9], [1498, 548, 9]]

# ---------------------------------------------------------------- 奥行き（パララックス）
depth:
  sky: 0.04
  clouds: [0.07, 0.13]           # 地平線近くの雲 / 高い雲
  ground: [[560, 0.24], [640, 0.36], [700, 0.46], [941, 0.95]]   # 水面・岸：y ごとの奥行き
  regions:                       # 岸の上の物は、根元の奥行きにそろえる（上から順に上書き）
    - {poly: [[1150, 380], [1672, 380], [1672, 600], [1150, 600]], depth: 0.24}   # 向こう岸
    - {poly: [[0, 0], [1180, 0], [1180, 690], [0, 690]], depth: 0.44}           # 手前の岸（家・ヤシ）
    - {poly: [[0, 0], [640, 0], [640, 430], [300, 620], [0, 620]], depth: 0.52} # 花の木・バナナ
  foreground: 1.0
  soften: 30

# ---------------------------------------------------------------- 動き
motion:
  camera: {shift: [12, 4], zoom: 0.008}   # 奥行き 1 のときのずれ（出力 px）と寄り引き
  wind: {speed: 520}                      # 風の波が画面を渡る速さ（出力 px/秒）
  clouds: {drift: 9, billow: 1.8}         # 雲が左右に漂う幅（片側、出力 px）と形のうねり（px）
  stars: {twinkle: 0.45}
  moon: {glow: 0.06}
  water:
    flow: [1.2, 8.0]             # 流れの速さ 奥 / 手前（出力 px/秒、左へ）
    ripple: [0.35, 1.8]          # 波のゆらぎ 奥 / 手前（px）
    shimmer: 2.4                 # 映り込みのきらめき（px）
    glint: 0.35                  # 映り込みの明るさのゆらぎ
    pads: 0.7                    # 蓮の葉の上下
    boat: 1.1
  lights: {flicker: 0.07}
  sway:                          # 風で揺れる物。amp は先端の揺れ（出力 px）
    - {name: palm_a, base: [704, 480], top: [735, 232], radius: 85, amp: 3.2}
    - {name: palm_b, base: [805, 500], top: [838, 322], radius: 62, amp: 2.6}
    - {name: palm_c, base: [690, 470], top: [688, 300], radius: 40, amp: 1.8}
    - {name: palm_d, base: [770, 500], top: [772, 340], radius: 42, amp: 1.8}
    - {name: far_palms, amp: 0.7, radius: 26, rise: 45,
       tops: [[1040, 432], [1155, 460], [1217, 495], [1362, 477], [1450, 430], [1527, 415], [1582, 445], [1648, 428]]}
    - {name: flower_tree, base: [170, 560], amp: 2.4, flutter: 0.7,
       poly: [[0, 0], [570, 0], [640, 190], [645, 300], [560, 385], [430, 425], [300, 405], [120, 385], [0, 300]]}
    - {name: banana, base: [60, 600], amp: 1.6, flutter: 0.4,
       poly: [[0, 290], [160, 300], [295, 430], [300, 560], [180, 605], [0, 605]]}
    - {name: fern_tree, base: [600, 520], amp: 1.3, flutter: 0.5,
       poly: [[525, 300], [705, 300], [705, 470], [545, 480]]}
    - {name: banana_mid, base: [920, 560], amp: 1.0, flutter: 0.4,
       poly: [[868, 450], [975, 450], [975, 555], [868, 555]]}
    - {name: bushes, flutter: 0.5,
       polys: [[[40, 520], [270, 520], [270, 645], [40, 645]], [[268, 455], [340, 455], [340, 585], [268, 585]],
               [[568, 495], [640, 495], [640, 560], [568, 560]], [[815, 515], [905, 515], [905, 560], [815, 560]]]}
  protect:                       # 風で揺らさない物（家・柵・灯籠）。上の揺れの範囲と重なっても動かない
    - [[335, 500], [375, 420], [465, 396], [520, 440], [570, 505], [562, 590], [330, 590]]      # 家1
    - [[622, 532], [672, 450], [722, 452], [812, 528], [802, 592], [628, 592]]                 # 家2
    - [[924, 562], [958, 520], [1012, 520], [1042, 562], [1036, 595], [924, 595]]              # 家3
    - [[1060, 578], [1084, 546], [1118, 546], [1140, 578], [1136, 598], [1060, 598]]           # 家4
    - [[1318, 530], [1565, 530], [1565, 566], [1318, 566]]                                     # 向こう岸の家
    - [[455, 545], [1185, 545], [1185, 602], [455, 602]]                                       # 柵
    - [[788, 530], [814, 530], [814, 600], [788, 600]]                                         # 灯籠
  reeds: {amp: 5.5, top: 610, bottom: 941, flutter: 0.8}

# ---------------------------------------------------------------- 足す効果
fx:
  fireflies:
    count: 34
    zone: [[40, 470], [1180, 470], [1300, 620], [1300, 780], [300, 780], [40, 700]]
    color: [255, 236, 150]
    size: 1.15
  petals:                        # 花の木から散る花びら
    count: 14
    spawn: [80, 80, 600, 380]
    land: [560, 690]
  mist:                          # 霧（ゆっくり流れる）。layer: sky は空の層（木や家の後ろ）
    - {rect: [560, 60, 1672, 470], layer: sky, opacity: 0.13, speed: 9}   # 夜空の薄い霧のすじ（月の近くは明るく）
    - {rect: [700, 548, 1672, 640], opacity: 0.20, speed: -6}             # 向こう岸の川霧（川と同じく左へ）
    - {rect: [0, 670, 1300, 760], opacity: 0.12, speed: -8}               # 手前の岸の川霧
  bokeh:                         # 手前のボケ
    # 花の木の枝先（空に掛かっている所）を左右反転して、右上の端から差し込む（レンズの前のボケ）
    branch: {source: [380, 95, 560, 235], flip: true, at: [1.02, 0.10], scale: 2.3, angle: 0,
             blur: 8, shade: 0.8, sway: 1.3, depth: 2.0, fade_bottom: 0.3}
    petals: 5
  bloom: {threshold: 0.7, strength: 0.18}   # 明るい所の光のにじみ
  vignette: 0.22
